name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages. Runs on every push to
# `main` plus a weekly schedule, so the content that is pulled at build time
# stays current without a commit.

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild (Mondays 06:00 UTC) to pull fresh Medium articles
    # and keep the upcoming/past split of talks current.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# No permissions by default; each job below grants only what it needs.
permissions: {}

# Allow only one concurrent Pages deployment, without cancelling in-progress
# runs - cancelling mid-deployment can leave the Pages site in a partial state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      - name: Build with Astro
        uses: withastro/action@v6.1.2
        env:
          # Handed to the build as an environment variable - never interpolated
          # into a run script - and read by src/lib/github.ts to fetch the
          # current repo star counts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
