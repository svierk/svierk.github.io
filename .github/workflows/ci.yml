name: Validation

# Validates changes to this repository: installs the dependencies and runs a
# full production build of the Astro site, so a broken page, data file or
# translation fails here before it can reach the Pages deployment on `main`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # NODE_VERSION_OVERRIDE is a repository variable; unset it to fall back
      # to engines.node from package.json, populate it to pin a version
      # without touching this workflow file.
      - name: Select Node Version
        uses: svierk/get-node-version@v1.5.1
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}

      - name: Install Dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build
        env:
          # Handed to the build as an environment variable - never interpolated
          # into the run script - and read by src/lib/github.ts to fetch the
          # current repo star counts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
